[project]
name = "northstar-rag"
version = "0.1.0"
description = "Agentic RAG assistant over NorthStar Bank customer guides (LangGraph + LangChain)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # LLM / orchestration
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-classic>=1.0",
    "langchain-community>=0.4",
    "langchain-openai>=1.0",
    "langchain-chroma>=1.0",
    "langchain-text-splitters>=1.0",
    "langgraph>=1.0",
    "openai>=2.0",
    # data models / config
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    # ingestion / retrieval
    "pymupdf4llm>=0.2",
    "chromadb>=1.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
    "langchain-tavily>=0.2.18",
    "streamlit>=1.67.0",
    "langgraph-checkpoint-sqlite>=3.1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ipykernel>=6.0",
    "ruff>=0.17.5",
]

[project.scripts]
northstar-rag = "northstar_rag.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/northstar_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# E/W = PEP 8 style, F = real errors (unused names, typos), I = import order,
# B = common bugs, UP = modern Python syntax, SIM = simpler code
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
